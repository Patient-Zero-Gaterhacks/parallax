<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 320px; font: 14px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; margin: 12px; color: #1c1b19; }
  h1 { font-size: 16px; margin: 0 0 8px; }
  .v { padding: 8px; border-radius: 8px; margin-bottom: 10px; font-weight: 600; }
  .threat { background: #fdecea; color: #b42318; } .caution { background: #fff4dd; color: #9a6100; } .clean { background: #e7f5ee; color: #1f7a4d; }
  button, label.file { display: block; width: 100%; text-align: left; font: inherit; padding: 8px 10px; margin: 6px 0;
    border-radius: 8px; border: 1px solid #ddd; background: #fafafa; cursor: pointer; box-sizing: border-box; }
  #out { font-size: 13px; color: #444; white-space: pre-wrap; margin-top: 8px; }
  small { color: #6b6862; }
</style>
</head>
<body>
  <h1>Parallax</h1>
  <div id="verdict" class="v clean">Checking this page…</div>
  <button id="cloak">Check if this page shows AI something different</button>
  <label class="file">Scan a PDF, Word file or saved email…<input id="file" type="file" accept=".pdf,.docx,.eml,.html" hidden></label>
  <div id="out"></div>
  <small>Server: <span id="srv"></span></small>
  <script src="popup.js"></script>
</body>
</html>
